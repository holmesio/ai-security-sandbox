[project]
name = "ai-security-sandbox"
version = "0.1.0"
description = "Hands-on AI Security Engineering sandbox: guardrails, secure LLM integrations, cost/DoS rate limiting, and injection-resistant RAG."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",            # async client lives in redis.asyncio
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "anthropic>=0.39",
    "structlog>=24.1",
    "tiktoken>=0.7",         # local token estimation for pre-flight cost checks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",       # in-memory Redis (incl. Lua) for unit tests
    "ruff>=0.5",
    "mypy>=1.10",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live docker services (redis, qdrant)",
    "adversarial: red-team / attack-simulation tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
# S101 (assert) is fine in tests
per-file-ignores = { "tests/**" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
